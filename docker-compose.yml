# Postgres 16 + pgvector — stack objetivo para RAG híbrido (BM25 + embeddings).
# Uso: docker compose up -d
# DATABASE_URL (Postgres): postgresql://lextrack:${POSTGRES_PASSWORD}@localhost:5432/lextrack
# ⚠️  Change POSTGRES_PASSWORD before deploying to staging or production!
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://lextrack:lextrack@postgres:5432/lextrack
      - PORT=3000
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: lextrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lextrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-use-a-strong-password}
      POSTGRES_DB: lextrack
    ports:
      - "5432:5432"
    volumes:
      - lextrack_pgdata:/var/lib/postgresql/data
      - ./db/docker/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lextrack -d lextrack"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  lextrack_pgdata:
