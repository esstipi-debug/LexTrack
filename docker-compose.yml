# Postgres 16 + pgvector — stack objetivo para RAG híbrido (BM25 + embeddings).
# Uso: docker compose up -d
# DATABASE_URL (Postgres): postgresql://lextrack:${POSTGRES_PASSWORD}@localhost:5432/lextrack
# ⚠️  Change POSTGRES_PASSWORD before deploying to staging or production!
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://lextrack:lextrack@postgres:5432/lextrack
      - PORT=3000
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: lextrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lextrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-use-a-strong-password}
      POSTGRES_DB: lextrack
    ports:
      - "5432:5432"
    volumes:
      - lextrack_pgdata:/var/lib/postgresql/data
      - ./db/docker/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lextrack -d lextrack"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# Run with backup: docker compose --profile backup up -d
# Backups stored in ./backups/, rotated after 7 days
  backup:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD:-lextrack}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c "while true; do
        pg_dump -h postgres -U $${POSTGRES_USER:-lextrack} $${POSTGRES_DB:-lextrack}
        | gzip > /backups/backup_$$(date +%Y%m%d_%H%M%S).sql.gz;
        echo \"Backup completed at $$(date)\";
        find /backups -name '*.sql.gz' -mtime +7 -delete;
        sleep 86400;
      done"
    restart: unless-stopped
    profiles:
      - backup

volumes:
  lextrack_pgdata:
  # backups/ is a bind mount (local dir), not a named volume
