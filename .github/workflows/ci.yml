name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lextrack
          POSTGRES_PASSWORD: lextrack
          POSTGRES_DB: lextrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # Real Postgres service is available in CI — DATABASE_URL points to it.
      DATABASE_URL: postgres://lextrack:lextrack@localhost:5432/lextrack_test
      DATABASE_URL_POSTGRES: postgres://lextrack:lextrack@localhost:5432/lextrack_test
      RAG_DATABASE_URL: postgres://lextrack:lextrack@localhost:5432/lextrack_test
      ANTHROPIC_API_KEY: dummy
      ANTHROPIC_MODEL: claude-sonnet-4-20250514
      VOYAGE_API_KEY: dummy
      COHERE_API_KEY: dummy
      OWNER_UNION_ID: dummy
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://lextrack:lextrack@localhost:5432/lextrack_test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        # NOTE: run npm run db:migrate before deploying to production

  migration-check:
    name: migration-check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://user:pass@localhost:5432/lextrack
      DATABASE_URL_POSTGRES: postgres://user:pass@localhost:5432/lextrack
      RAG_DATABASE_URL: postgres://user:pass@localhost:5432/lextrack_rag
      ANTHROPIC_API_KEY: dummy
      ANTHROPIC_MODEL: claude-sonnet-4-20250514
      VOYAGE_API_KEY: dummy
      COHERE_API_KEY: dummy
      OWNER_UNION_ID: dummy
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for uncommitted migrations
        run: |
          npm run db:generate 2>&1 | grep -q "No schema changes" || echo "::warning::Schema changes detected — run db:generate and commit migrations"
